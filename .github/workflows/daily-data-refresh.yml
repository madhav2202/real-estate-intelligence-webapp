name: Daily Plinth Data Refresh

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-plinth-data-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 pandas openpyxl

      - name: Refresh ReraTracker fields
        run: python scripts/refresh_reratracker.py

      - name: Refresh Haryana RERA absorption
        continue-on-error: true
        run: >
          python scripts/scrape_haryana_rera_absorption.py
          --input outputs/plinth_recalc_absorption_full.csv
          --output outputs/plinth_recalc_absorption_full.csv
          --project-id-column project_id
          --delay 0.5

      - name: Apply scraped updates to platform data
        run: python scripts/apply_scraped_project_updates.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reratracker_refresh.csv data/projects-data.json data/projects-data.js outputs/*.csv analysis/reratracker_refresh_report.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh Plinth scraped project data"
            git push
          fi
